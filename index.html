<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظر من × نظر جهان</title><style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;800;900&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Vazirmatn,Tahoma,sans-serif}body{color:#fff;background:#080910;overflow-x:hidden}.bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:#090a10}.bg:before{content:"";position:absolute;inset:-25%;background:linear-gradient(90deg,#ff2352 0%,#ff2352 var(--split,50%),#277dff var(--split,50%),#277dff 100%);transform:scale(1.12);filter:saturate(1.15);transition:background 1.8s cubic-bezier(.16,1,.3,1)}.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--split,50%) 50%,#fff4,transparent 18%),linear-gradient(90deg,#fff1,transparent 45%,#fff1);transition:background 1.8s ease}.orb{position:absolute;width:38vw;height:38vw;max-width:500px;max-height:500px;border-radius:50%;filter:blur(45px);opacity:.28;mix-blend-mode:screen;animation:float 7s ease-in-out infinite}.orbR{background:#ff2352;left:-12%;top:18%}.orbB{background:#277dff;right:-12%;bottom:10%;animation-delay:-3.5s}.glow{position:absolute;top:-20%;bottom:-20%;left:var(--split,50%);width:90px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#fff4,transparent);filter:blur(14px);opacity:.7;transition:left 1.8s cubic-bezier(.16,1,.3,1)}@keyframes float{50%{transform:translate(35px,-25px) scale(1.08)}}
.wrap{width:min(900px,100%);margin:auto;padding:22px 16px 45px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.logo{font-size:24px;font-weight:900}.logo span{opacity:.35}.counter{font-size:13px;font-weight:800;background:#ffffff12;border:1px solid #ffffff18;border-radius:999px;padding:8px 14px}.line{height:5px;background:#ffffff12;border-radius:9px;overflow:hidden;margin-bottom:25px}.line i{display:block;width:0;height:100%;background:linear-gradient(90deg,#ff2855,#287dff);transition:.7s}.card{border:1px solid #ffffff1c;border-radius:30px;background:#080a12d9;box-shadow:0 30px 90px #000b;backdrop-filter:blur(20px);padding:clamp(22px,5vw,48px)}.eyebrow{text-align:center;color:#9ea6bd;font-size:12px;font-weight:800;margin-bottom:12px}.q{text-align:center;font-size:clamp(28px,6vw,48px);line-height:1.35;font-weight:900;margin:0 0 34px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{position:relative;min-height:190px;border:0;border-radius:24px;color:#fff;padding:24px;text-align:center;cursor:pointer;overflow:hidden;font-family:inherit;transition:transform .2s,filter .2s}.choice:hover{transform:translateY(-4px);filter:brightness(1.08)}.red{background:linear-gradient(145deg,#ff315d,#c20d3c)}.blue{background:linear-gradient(145deg,#398cff,#1550bd)}.label{font-size:12px;font-weight:800;opacity:.72;display:block;margin-bottom:17px}.txt{display:block;font-size:clamp(19px,3vw,27px);font-weight:900;line-height:1.35;position:relative;z-index:4}.fill{position:absolute;bottom:0;right:0;height:100%;width:0;background:#0003;transition:width 1.6s cubic-bezier(.16,1,.3,1);z-index:2}.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff28 50%,transparent 70%);transform:translateX(-120%);z-index:3}.revealed .shine{animation:shine 1.5s ease}@keyframes shine{to{transform:translateX(120%)}}.choice.revealed .txt,.choice.revealed .label{opacity:.18;transition:.5s}.resultBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:5;opacity:0;pointer-events:none}.revealed .resultBox{opacity:1}.resultPct{font-size:52px;font-weight:900;line-height:1}.world{font-size:11px;font-weight:700;margin-top:7px;opacity:.8}.hint{text-align:center;color:#717a91;font-size:11px;margin-top:18px}.hidden{display:none!important}.result{text-align:center}.result h2{font-size:clamp(27px,6vw,46px);margin:0 0 12px;font-weight:900}.big{font-size:76px;font-weight:900;background:linear-gradient(90deg,#ff315d,#398cff);-webkit-background-clip:text;color:transparent}.analysis{margin-top:20px;padding:22px;border-radius:22px;background:#ffffff09;border:1px solid #ffffff12;text-align:right;line-height:2;font-size:14px;color:#dce1ef}.btn{margin:6px;border:0;border-radius:15px;padding:13px 20px;font-family:inherit;font-weight:900;cursor:pointer;color:#fff}.share{background:linear-gradient(135deg,#6b55ff,#2b8cff)}.again{background:#fff;color:#111}.copy{background:#ffffff15}.shareBox{margin:18px auto 0;max-width:600px;padding:18px;border-radius:20px;background:#ffffff0b;border:1px solid #ffffff14}.shareTitle{font-weight:900;font-size:18px}.shareHint{font-size:12px;color:#aab2c7;line-height:1.8;margin:8px 0}.shareBox input{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff18;background:#0005;color:#fff;font-family:inherit;direction:ltr}.msg{font-size:12px;color:#8ff0b0;margin-top:8px}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff15;font-size:12px;margin-bottom:14px}@media(max-width:600px){.choices{grid-template-columns:1fr}.choice{min-height:135px}.card{padding:22px 15px}.q{font-size:29px}.orb{width:70vw;height:70vw}.glow{width:55px}}
</style></head><body><div class="bg" id="bg"><div class="orb orbR"></div><div class="orb orbB"></div><div class="glow"></div></div><main class="wrap"><div class="top"><div class="logo">نظر من <span>×</span> نظر جهان</div><div class="counter" id="counter"></div></div><div class="line"><i id="progress"></i></div><section class="card" id="game"><div class="eyebrow" id="mode"></div><h1 class="q" id="question"></h1><div class="choices"><button class="choice red" id="red"><span class="label">قرمز</span><span class="txt" id="redText"></span><span class="fill" id="redFill"></span><span class="shine"></span><span class="resultBox"><b class="resultPct" id="redPct"></b><span class="world">نظر جهان</span></span></button><button class="choice blue" id="blue"><span class="label">آبی</span><span class="txt" id="blueText"></span><span class="fill" id="blueFill"></span><span class="shine"></span><span class="resultBox"><b class="resultPct" id="bluePct"></b><span class="world">نظر جهان</span></span></button></div><div class="hint">درصدها بعد از انتخاب تو آشکار می‌شوند.</div></section><section class="card result hidden" id="result"><div class="eyebrow">نتیجه نهایی</div><div id="resultBadge"></div><h2 id="resultTitle">تو چقدر با نظر اکثریت جهان هم‌نظری؟</h2><div class="big" id="score">۰٪</div><div class="analysis" id="analysis"></div><div id="actions"></div></section></main><script>
const Q=[['تابستان ☀️ یا زمستان ❄️؟','تابستان','زمستان',62,38],['سفر دریا 🌊 یا کوهستان ⛰️؟','دریا','کوهستان',57,43],['صبح زود 🌅 یا شب دیر 🌙؟','صبح زود','شب دیر',36,64],['فیلم 🎬 یا بازی 🎮؟','فیلم','بازی',54,46],['پیتزا 🍕 یا همبرگر 🍔؟','پیتزا','همبرگر',61,39],['شهر شلوغ 🌆 یا جای آرام 🌿؟','شهر شلوغ','جای آرام',28,72],['باران 🌧️ یا برف ❄️؟','باران','برف',66,34],['پول بیشتر 💰 یا وقت آزاد بیشتر ⏳؟','پول بیشتر','وقت آزاد بیشتر',47,53],['تنهایی 🎧 یا جمع دوستان 🧑‍🤝‍🧑؟','تنهایی','جمع دوستان',31,69],['گذشته ⏪ یا آینده 🚀؟','گذشته','آینده',22,78]];
let idx=0,locked=false,answers=[],mode='normal',ownerAnswers=null,friendAnswers=null;const $=x=>document.getElementById(x),fa=n=>n.toLocaleString('fa-IR');
function enc(obj){const s=JSON.stringify(obj),b=new TextEncoder().encode(s);let bin='';for(const x of b)bin+=String.fromCharCode(x);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const bin=atob(t),b=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(b))}
function valid(a){return Array.isArray(a)&&a.length===Q.length&&a.every(x=>x==='red'||x==='blue')}
function render(){const q=Q[idx];$('question').textContent=q[0];$('redText').textContent=q[1];$('blueText').textContent=q[2];$('counter').textContent=fa(idx+1)+' / '+fa(Q.length);$('progress').style.width=(idx/Q.length*100)+'%';$('red').classList.remove('revealed');$('blue').classList.remove('revealed');$('redFill').style.width='0';$('blueFill').style.width='0';$('redPct').textContent='';$('bluePct').textContent='';$('bg').style.setProperty('--split','50%');$('red').disabled=false;$('blue').disabled=false;locked=false}
function choose(which){if(locked)return;locked=true;answers[idx]=which;const q=Q[idx];$('red').disabled=true;$('blue').disabled=true;$('red').classList.add('revealed');$('blue').classList.add('revealed');$('redPct').textContent=fa(q[3])+'٪';$('bluePct').textContent=fa(q[4])+'٪';requestAnimationFrame(()=>requestAnimationFrame(()=>{$('redFill').style.width=q[3]+'%';$('blueFill').style.width=q[4]+'%';$('bg').style.setProperty('--split',q[3]+'%')}));setTimeout(()=>{idx++;if(idx<Q.length)render();else finishRound()},2100)}
function worldScore(a){let n=0;for(let j=0;j<Q.length;j++)if((a[j]==='red'?Q[j][3]:Q[j][4])>=50)n++;return Math.round(n/Q.length*100)}
function sameScore(a,b){let n=0;for(let j=0;j<Q.length;j++)if(a[j]===b[j])n++;return Math.round(n/Q.length*100)}
function finishRound(){if(mode==='friend')finishFriend();else if(mode==='final')finishFinal();else finishNormal()}
function baseActions(){return '<button class="btn again" onclick="restart()">دوباره بازی کن</button>'}
function finishNormal(){const s=worldScore(answers);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('progress').style.width='100%';$('counter').textContent='تمام شد';$('resultBadge').innerHTML='<span class="badge">نتیجه تو</span>';$('resultTitle').textContent='تو چقدر با نظر اکثریت جهان هم‌نظری؟';$('score').textContent=fa(s)+'٪';$('analysis').innerHTML='<b>تحلیل تو</b><br>'+ (s>=80?'انتخاب‌هایت خیلی نزدیک به انتخاب‌های غالب جهان بود.':s>=60?'در بیشتر انتخاب‌ها با انتخاب غالب جهان هم‌جهت بودی.':'انتخاب‌هایت تفاوت جالبی با انتخاب غالب جهان دارد.')+'<br><br>حالا می‌توانی جواب‌هایت را برای یک دوست بفرستی و ببینی چقدر شبیه هم هستید.';$('actions').innerHTML='<button class="btn share" onclick="createChallenge()">🤝 چالش با دوست</button>'+baseActions()+'<div class="shareBox hidden" id="shareBox"><div class="shareTitle">لینک چالش آماده است</div><div class="shareHint">این لینک را برای دوستت بفرست. او همان ۱۰ سؤال را جواب می‌دهد و در پایان لینک نتیجهٔ مشترک ساخته می‌شود.</div><input id="shareLink" readonly><button class="btn copy" onclick="copyLink()">کپی لینک</button><div class="msg" id="msg"></div></div>'}
function createChallenge(){const url=location.href.split('#')[0]+'#friend='+enc(answers);const box=$('shareBox');box.classList.remove('hidden');$('shareLink').value=url;if(navigator.share)navigator.share({title:'نظر من × نظر جهان',text:'بیا ببینیم چقدر شبیه هم فکر می‌کنیم!',url}).catch(()=>{})}
async function copyLink(){const x=$('shareLink').value;try{await navigator.clipboard.writeText(x)}catch(e){$('shareLink').select();document.execCommand('copy')}$('msg').textContent='لینک کپی شد ✅'}
function finishFriend(){const s=worldScore(answers),similar=sameScore(answers,ownerAnswers);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('progress').style.width='100%';$('counter').textContent='چالش تمام شد';$('resultBadge').innerHTML='<span class="badge">دوستت جواب داد 🎉</span>';$('resultTitle').textContent='حالا نتیجهٔ شما دو نفر را ببین';$('score').textContent=fa(similar)+'٪';$('analysis').innerHTML='<b>🤝 شباهت شما: '+fa(similar)+'٪</b><br><br>🌎 شباهت دوستت با جهان: '+fa(s)+'٪<br>🌎 شباهت صاحب چالش با جهان: '+fa(worldScore(ownerAnswers))+'٪<br><br>برای اینکه صاحب چالش هم همین نتیجه را ببیند، روی دکمهٔ زیر بزن و لینک نتیجه را برای او بفرست.';$('actions').innerHTML='<button class="btn share" onclick="makeFinalLink()">🔗 ساخت لینک نتیجه برای صاحب چالش</button>'+baseActions()+'<div class="shareBox hidden" id="finalBox"><div class="shareTitle">لینک نتیجهٔ مشترک آماده شد</div><div class="shareHint">این لینک را برای صاحب چالش بفرست؛ نتیجهٔ هر دو نفر و مقایسه با جهان داخل آن است.</div><input id="finalLink" readonly><button class="btn copy" onclick="copyFinal()">کپی لینک</button><div class="msg" id="finalMsg"></div></div>'}
function makeFinalLink(){const url=location.href.split('#')[0]+'#result='+enc({a:ownerAnswers,b:answers});$('finalBox').classList.remove('hidden');$('finalLink').value=url;if(navigator.share)navigator.share({title:'نتیجه نظر من × نظر جهان',text:'نتیجه مقایسهٔ ما آماده شد!',url}).catch(()=>{})}
async function copyFinal(){try{await navigator.clipboard.writeText($('finalLink').value)}catch(e){$('finalLink').select();document.execCommand('copy')}$('finalMsg').textContent='لینک کپی شد ✅'}
function finishFinal(){const sa=worldScore(ownerAnswers),sb=worldScore(friendAnswers),sim=sameScore(ownerAnswers,friendAnswers);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('progress').style.width='100%';$('counter').textContent='نتیجه مشترک';$('resultBadge').innerHTML='<span class="badge">🏆 نتیجهٔ نهایی دو نفره</span>';$('resultTitle').textContent='تو و دوستت چقدر شبیه هم هستید؟';$('score').textContent=fa(sim)+'٪';$('analysis').innerHTML='<b>🤝 شباهت شما: '+fa(sim)+'٪</b><br><br>🔴 نفر اول با جهان: <strong>'+fa(sa)+'٪</strong><br>🔵 نفر دوم با جهان: <strong>'+fa(sb)+'٪</strong><br><br>'+(sim>=80?'تقریباً هم‌فکر هستید! 🔥':sim>=50?'بیشتر از نصف انتخاب‌هایتان شبیه هم بود.':'انتخاب‌هایتان تفاوت جالبی دارد! 😄');$('actions').innerHTML=baseActions()}
function restart(){location.hash='';location.reload()}
function load(){const h=location.hash;if(!h){mode='normal';$('mode').textContent='فقط یکی را انتخاب کن';render();return}try{const [kind,data]=h.slice(1).split('=');const obj=dec(data||'');if(kind==='friend'&&valid(obj)){mode='friend';ownerAnswers=obj;answers=[];idx=0;$('mode').textContent='🤝 چالش با دوست — جواب خودت را ثبت کن';render();return}if(kind==='result'&&obj&&valid(obj.a)&&valid(obj.b)){mode='final';ownerAnswers=obj.a;friendAnswers=obj.b;answers=obj.b.slice();idx=Q.length;finishFinal();return}throw 0}catch(e){history.replaceState(null,'',location.pathname+location.search);mode='normal';$('mode').textContent='فقط یکی را انتخاب کن';render()}}
$('red').onclick=()=>choose('red');$('blue').onclick=()=>choose('blue');load();
</script></body></html>
